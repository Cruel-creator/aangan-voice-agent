# Test fixtures derived from the September 2026 enquiry transcripts.
# Two uses:
#   1. Engine tests (tests/test_transcripts.py): feed `facts` to app/qualify/decision.py
#      with `today` = call_date and assert `expected.outcome` and `expected.flags`.
#   2. Simulated calls (tests/sim/): an LLM plays the caller using `caller_brief`;
#      assert the agent reaches the same outcome and never speaks a price.
#
# Outcomes: QUALIFIED | DECLINE_SCOPE | DECLINE_AREA | DECLINE_TIMELINE |
#           BUDGET_MISALIGNED | HUMAN_REVIEW | ESCALATE_URGENT | NOT_APPLICABLE
# Flags:    TIGHT | VIP | RECOVERY | DECISION_NOTE | PRICING_ASKED | RESUMED_CALL
#
# Budget ranges use the LOWER bound. Month-only dates resolve to end of month.
# Where a transcript never states a timeline, `flexible: true` assumes the caller
# answers "no fixed deadline" when asked (marked `assumed`).

cases:
  - id: T01
    call_date: 2026-09-02
    caller_brief: "Priya, referred by Shruti Joshi. 3BHK Kothrud, 1,400 sq ft, full redesign. Done by March. Owner with husband, he approves."
    facts: { intent: new, locality: Kothrud, property_type: apartment, project_category: residential,
             rooms: [kitchen, living, bedroom, bedroom], area_sqft: 1400, service: design_and_execution,
             completion: "March", flexible: false, budget_inr: null, decision_maker: owner }
    expected: { outcome: QUALIFIED, flags: [] }

  - id: T02
    call_date: 2026-09-03
    caller_brief: "2BHK Wakad, 950 sq ft, full redesign. Moving in November. Pushes twice for a ballpark price."
    facts: { intent: new, locality: Wakad, property_type: apartment, project_category: residential,
             rooms: [kitchen, living, bedroom, bedroom], area_sqft: 950, service: design_and_execution,
             completion: "November", flexible: false, budget_inr: null, decision_maker: owner }
    expected: { outcome: QUALIFIED, flags: [TIGHT, PRICING_ASKED] }
    note: "Nov 30 is ~12.6 weeks from Sep 3 → tight, still books. Must not speak any price."

