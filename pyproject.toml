[project]
name = "aangan-voice-agent"
version = "0.1.0"
description = "Aangan Studio voice enquiry agent backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "cryptography>=42",
    "google-api-python-client>=2.130",
    "google-auth>=2.29",
    "python-multipart>=0.0.32",
    "tzdata>=2026.5",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "anthropic>=1.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]
sim = []

[tool.vercel]
entrypoint = "app.main:app"  # Vercel loads the FastAPI app from app/main.py

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/sim"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the framework idiom
